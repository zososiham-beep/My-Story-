<body>
    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Website</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        /* NAVBAR */
        .navbar {
            background: #222;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #fff;
        }
        .navbar a {
            color: #fff;
            margin-left: 20px;
            text-decoration: none;
            font-weight: bold;
        }
        .navbar a:hover {
            color: #00b3ff;
        }

        /* CARD GRID */
        .card-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            padding: 40px;
        }
        .card {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
        }
        .card img {
            width: 100%;
            border-radius: 8px;
        }
        .card h3 {
            margin-top: 15px;
        }

        /* FOOTER */
        .footer {
            background: #222;
            color: #fff;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <div class="navbar">
        <h2>My Website</h2>
        <div>
            <a href="#">Home</a>
            <a href="#">Services</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </div>
    </div>

    <!-- 4 CARDS -->
    <div class="card-container">
        <div class="card">
            <img src="https://via.placeholder.com/300" alt="Card 1">
            <h3>Card One</h3>
            <p>A simple description for card one.</p>
        </div>

        <div class="card">
            <img src="https://via.placeholder.com/300" alt="Card 2">
            <h3>Card Two</h3>
            <p>A simple description for card two.</p>
        </div>

        <div class="card">
            <img src="https://via.placeholder.com/300" alt="Card 3">
            <h3>Card Three</h3>
            <p>A simple description for card three.</p>
        </div>

        <div class="card">
            <img src="https://via.placeholder.com/300" alt="Card 4">
            <h3>Card Four</h3>
            <p>A simple description for card four.</p>
        </div>
    </div>

    <!-- FOOTER -->
    <div class="footer">
        <p>© 2025 My Website. All Rights Reserved.</p>
    </div>

</body>
</html>

</body>
</html>
